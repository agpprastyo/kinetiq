{{- $ctx := dict "root" . "component" "auth" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-auth
  labels: {{- include "kinetiq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels: {{- include "kinetiq.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kinetiq.selector" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "kinetiq.antiAffinity" $ctx | nindent 6 }}
      containers:
        - name: auth
          image: {{ include "kinetiq.image" (dict "root" . "name" "auth") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.auth.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: PORT
              value: {{ .Values.auth.port | quote }}
            - name: WEB_ORIGIN
              value: {{ .Values.config.WEB_ORIGIN | quote }}
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.auth.port }} }
          readinessProbe:
            httpGet: { path: /readyz, port: {{ .Values.auth.port }} }
          resources: {{- toYaml .Values.auth.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-auth
  labels: {{- include "kinetiq.labels" . | nindent 4 }}
spec:
  selector: {{- include "kinetiq.selector" $ctx | nindent 4 }}
  ports:
    - port: {{ .Values.auth.port }}
      targetPort: {{ .Values.auth.port }}
---
{{ include "kinetiq.pdb" (dict "root" . "component" "auth" "values" .Values.auth) }}
