{{- $ctx := dict "root" . "component" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels: {{- include "kinetiq.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "kinetiq.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kinetiq.selector" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- include "kinetiq.antiAffinity" $ctx | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "kinetiq.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/kinetiq-worker"]
          {{- include "kinetiq.backendEnv" . | nindent 10 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
---
{{ include "kinetiq.pdb" (dict "root" . "component" "worker" "values" .Values.worker) }}
