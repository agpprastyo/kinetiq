global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'component', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-ops'
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'pagerduty-critical'
      continue: true
    - matchers:
        - severity = "warning"
      receiver: 'email-ops'
      continue: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['component']

receivers:
  - name: 'slack-ops'
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        channel: '#kinetiq-ops-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}*Severity:* {{ .Labels.severity }}\n*Summary:* {{ .Annotations.summary }}\n*Runbook:* {{ .Annotations.runbook }}\n{{ end }}'

  - name: 'email-ops'
    email_configs:
      - to: 'ops@example.com'
        from: 'alertmanager@example.com'
        smarthost: 'smtp.example.com:587'
        send_resolved: true

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        severity: '{{ .CommonLabels.severity }}'
        send_resolved: true
