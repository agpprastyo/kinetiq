
services:
  kinetiq-db:
    image: timescale/timescaledb:latest-pg16
    container_name: kinetiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinetiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinetiq_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-kinetiq}
    volumes:
      - kinetiq_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinetiq} -d ${POSTGRES_DB:-kinetiq}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kinetiq-redis:
    image: redis:7-alpine
    container_name: kinetiq-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - kinetiq_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kinetiq-auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    container_name: kinetiq-auth
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-kinetiq}:${POSTGRES_PASSWORD:-kinetiq_secure_password}@kinetiq-db:5432/${POSTGRES_DB:-kinetiq}?sslmode=disable"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-changeme_better_auth_secret_kinetiq}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-changeme_internal_secret_kinetiq}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3001}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      kinetiq-db:
        condition: service_healthy

  kinetiq-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kinetiq-api
    restart: unless-stopped
    command: ["/app/kinetiq-api"]
    environment:
      PORT: 8080
      DATABASE_URL: "postgres://${POSTGRES_USER:-kinetiq}:${POSTGRES_PASSWORD:-kinetiq_secure_password}@kinetiq-db:5432/${POSTGRES_DB:-kinetiq}?sslmode=disable"
      REDIS_URL: "redis://kinetiq-redis:6379"
      AUTH_BASE_URL: "http://kinetiq-auth:3001"
      AUTH_INTERNAL_SECRET: ${INTERNAL_AUTH_SECRET:-changeme_internal_secret_kinetiq}
      RATE_LIMIT_RPS: 500
      RATE_LIMIT_BURST: 1000
    ports:
      - "8080:8080"
    depends_on:
      kinetiq-db:
        condition: service_healthy
      kinetiq-redis:
        condition: service_healthy

  kinetiq-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kinetiq-worker
    restart: unless-stopped
    command: ["/app/kinetiq-worker"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-kinetiq}:${POSTGRES_PASSWORD:-kinetiq_secure_password}@kinetiq-db:5432/${POSTGRES_DB:-kinetiq}?sslmode=disable"
      REDIS_URL: "redis://kinetiq-redis:6379"
      AUTH_BASE_URL: "http://kinetiq-auth:3001"
      AUTH_INTERNAL_SECRET: ${INTERNAL_AUTH_SECRET:-changeme_internal_secret_kinetiq}
      WORKER_BATCH_SIZE: 500
      WORKER_FLUSH_INTERVAL: 1s
    depends_on:
      kinetiq-db:
        condition: service_healthy
      kinetiq-redis:
        condition: service_healthy

  kinetiq-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: kinetiq-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      PUBLIC_AUTH_URL: ${PUBLIC_AUTH_URL:-http://localhost:3001}
    depends_on:
      - kinetiq-api
      - kinetiq-auth

volumes:
  kinetiq_postgres_data:
  kinetiq_redis_data:
