name: Lint & Typecheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Code Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}...${{ github.sha }}" 2>/dev/null || echo "apps/api/all")
          fi
          
          CODE_CHANGED=$(echo "$CHANGED" | grep -vE '(\.md$|(^docs/|^apps/docs/)|^\.github/pull_request_template\.md|^\.gitignore$)' || true)
          if [ -z "$CODE_CHANGED" ]; then
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
            echo "Only documentation/markdown files modified. Fast-passing."
          else
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
            echo "Code files modified:"
            echo "$CODE_CHANGED"
          fi

      - name: Setup Go
        if: steps.filter.outputs.has_code_changes == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Setup Bun
        if: steps.filter.outputs.has_code_changes == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Bun Dependencies
        if: steps.filter.outputs.has_code_changes == 'true'
        run: |
          cd apps/auth && bun install
          cd ../web && bun install

      - name: Run Linters & Typecheck
        if: steps.filter.outputs.has_code_changes == 'true'
        run: make lint
