name: E2E Smoke Test

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: E2E Smoke Test (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Code Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "apps/api/all")
          fi
          
          CODE_CHANGED=$(echo "$CHANGED" | grep -vE '(\.md$|(^docs/|^apps/docs/)|^\.github/|^\.githooks/|^\.gitignore$|^scripts/)' || true)
          if [ -z "$CODE_CHANGED" ]; then
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
            echo "Only documentation/markdown/ci files modified. Fast-passing smoke test."
          else
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
            echo "Code files modified:"
            echo "$CODE_CHANGED"
          fi

      - name: Setup Docker Compose
        if: steps.filter.outputs.has_code_changes == 'true'
        run: |
          docker compose version

      - name: Start Stack
        if: steps.filter.outputs.has_code_changes == 'true'
        run: |
          docker compose -f docker-compose.e2e.yml up -d --build
          sleep 30

      - name: Wait for API Health
        if: steps.filter.outputs.has_code_changes == 'true'
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:18080/healthz && break
            sleep 5
          done

      - name: Run Smoke Test
        if: steps.filter.outputs.has_code_changes == 'true'
        run: |
          curl -fsS http://localhost:18080/healthz
          curl -fsS http://localhost:5173 >/dev/null
          echo "Smoke test passed"

      - name: Teardown
        if: always() && steps.filter.outputs.has_code_changes == 'true'
        run: docker compose -f docker-compose.e2e.yml down -v
