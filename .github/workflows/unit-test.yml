name: Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Code Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}...${{ github.sha }}" 2>/dev/null || echo "apps/api/all")
          fi

          CODE_CHANGED=$(echo "$CHANGED" | grep -vE '(\.md$|(^docs/|^apps/docs/)|^\.github/pull_request_template\.md|^\.gitignore$)' || true)
          if [ -z "$CODE_CHANGED" ]; then
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
            echo "Only documentation/markdown files modified. Fast-passing."
          else
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
            echo "Code files modified:"
            echo "$CODE_CHANGED"
          fi

      - name: Setup Go
        if: steps.filter.outputs.has_code_changes == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Run Unit Tests
        if: steps.filter.outputs.has_code_changes == 'true'
        run: make test-unit

  web-sdk-docs:
    name: Web, SDK Tests & Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Changed Areas
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}...${{ github.sha }}" 2>/dev/null || echo "apps/web/all packages/sdk/all apps/docs/all")
          fi

          if echo "$CHANGED" | grep -qE '^(apps/web/|packages/sdk/|\.github/workflows/unit-test\.yml|Makefile)'; then
            echo "run_js_tests=true" >> $GITHUB_OUTPUT
          else
            echo "run_js_tests=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE '^(apps/docs/|\.github/workflows/unit-test\.yml)'; then
            echo "run_docs_build=true" >> $GITHUB_OUTPUT
          else
            echo "run_docs_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.filter.outputs.run_js_tests == 'true' || steps.filter.outputs.run_docs_build == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Run Web & SDK Tests
        if: steps.filter.outputs.run_js_tests == 'true'
        run: |
          (cd packages/sdk && bun install --frozen-lockfile --ignore-scripts)
          make test-sdk
          (cd apps/web && bun install --frozen-lockfile --ignore-scripts)
          make test-web

      - name: Build Docs
        if: steps.filter.outputs.run_docs_build == 'true'
        run: |
          cd apps/docs
          bun install --frozen-lockfile --ignore-scripts
          bun run build
