run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - gosec

linters-settings:
  gosec:
    excludes:
      - G101 # Allow example test strings containing 'secret' or 'token'
      - G115 # Allow integer conversion bounds for simple counters
  errcheck:
    check-type-assertions: true

issues:
  exclude-dirs:
    - docs/swagger
